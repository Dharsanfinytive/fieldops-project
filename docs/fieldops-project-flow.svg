  <linearGradient id="navy" x2="1" y2="1"><stop stop-color="#133d70"/><stop offset="1" stop-color="#0c2851"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16385f" flood-opacity=".12"/></filter>
