  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#152b49}.title{font-size:35px;font-weight:800;letter-spacing:.5px}.subtitle{font-size:17px;fill:#526987}.section{font-size:17px;font-weight:800;fill:white;letter-spacing:.5px}.cardtitle{font-size:17px;font-weight:800}.body{font-size:13px;fill:#344b68}.small{font-size:12px;fill:#415a78}.tiny{font-size:11px;fill:#415a78}.label{font-size:12px;font-weight:700}
  </style>
</defs>
