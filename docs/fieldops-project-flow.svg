<g class="body"><text x="103" y="598">• Parse selected service and request</text><text x="103" y="620">• Check location and service signals</text><text x="103" y="642">• Prepare structured job details</text>
<text x="401" y="598">• Find eligible technicians</text><text x="401" y="620">• Match skill and availability</text><text x="401" y="642">• Rank candidates by fit/proximity</text>
<text x="699" y="598">• Offer job to technician</text><text x="699" y="620">• Handle acceptance or decline</text><text x="699" y="642">• Retry / redispatch if needed</text>
<text x="990" y="598">• Assignment notices</text><text x="990" y="620">• Job status updates</text><text x="990" y="642">• Escalations and alerts</text></g>
