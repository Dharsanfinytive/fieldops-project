<text x="102" y="716" class="label" fill="#8e6415">CURRENT INTAKE HANDOFF</text><text x="102" y="739" class="small">If Intake returns invalid, the customer portal currently builds a fallback request and still sends it to Planning.</text><text x="102" y="758" class="tiny">The separate workflow.py orchestration stops before Planning on invalid intake; the two paths behave differently.</text>
