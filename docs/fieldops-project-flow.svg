<circle cx="518" cy="510" r="21" fill="#417fc4"/><text x="518" y="517" font-size="21" fill="white">▦</text><text x="518" y="548" class="cardtitle" fill="#245b9c">PLANNING AGENT</text><text x="518" y="568" class="small">Technician recommendations</text>
<circle cx="816" cy="510" r="21" fill="#e88928"/><text x="816" y="517" font-size="20" fill="white">➤</text><text x="816" y="548" class="cardtitle" fill="#b85e1c">DISPATCH</text><text x="816" y="568" class="small">Assignment &amp; acceptance</text>
